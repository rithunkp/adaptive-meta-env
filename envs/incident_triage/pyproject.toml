[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-incident-triage"
version = "0.1.0"
description = "Incident triage OpenEnv environment for diagnosing production incidents under partial information"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "incident_triage.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["incident_triage", "incident_triage.server"]
package-dir = { "incident_triage" = ".", "incident_triage.server" = "server" }
