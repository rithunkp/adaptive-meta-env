spec_version: 1
name: openadapt
type: space
runtime: fastapi
app: server.app:app
port: 8000
variables:
  INCIDENT_TRIAGE_ECI: "1"
  INCIDENT_TRIAGE_MAX_STEPS: "20"
  SELF_TRAIN_ON_START: "true"
  SELF_TRAIN_MAX_STEPS: "1000"
  SELF_TRAIN_MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"
  SELF_TRAIN_LEARNING_RATE: "1e-5"
  SELF_TRAIN_OUTPUT_DIR: "artifacts/grpo_main"
  SELF_TRAIN_FINAL_MODEL_DIR: "artifacts/final_main"
  SELF_TRAIN_RUN_NAME: "openadapt-main"
  SELF_TRAIN_ENV_PATH: "generated_envs/incident_triage_env.py"
  SELF_TRAIN_ENV_CLASS: "IncidentTriageEnv"
